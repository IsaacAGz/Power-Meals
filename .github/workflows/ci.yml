# Lint, typecheck, unit/component tests and a production build on every push and pull request.
# Integration and Playwright tests need PostgreSQL and Redis and still run locally (CLAUDE.md, "Tests").
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps / LayoutProps are generated into .next/types, which a fresh checkout does not have.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Catches build-only errors (server/client boundaries, route config). Every outside service stays unset.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://powermealstj.com

  print-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/print-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/print-daemon/package-lock.json
      - run: npm ci
      - run: npm run typecheck
