# Lint, typecheck, unit/component tests and a production build; integration and Playwright tests against
# throwaway PostgreSQL and Redis containers; the print daemon typecheck. On every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps / LayoutProps are generated into .next/types, which a fresh checkout does not have.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Catches build-only errors (server/client boundaries, route config). Every outside service stays unset.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://powermealstj.com

  # Same suites as `npm run test:integration` and `npm run test:e2e` locally. tests/setup/test-env.ts only accepts
  # a *_test database and a Redis database other than 0, and every outside service stays off.
  services-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: powermeals
          POSTGRES_PASSWORD: powermeals
          POSTGRES_DB: powermeals_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U powermeals -d powermeals_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://powermeals:powermeals@127.0.0.1:5432/powermeals_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  print-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/print-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/print-daemon/package-lock.json
      - run: npm ci
      - run: npm run typecheck
