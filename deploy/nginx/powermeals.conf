# Reference server block for the existing Nginx install. Merge with the live config
# rather than replacing it; the rate-limit zones below may already exist under other names.

limit_req_zone $binary_remote_addr zone=pm_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pm_auth:10m rate=5r/m;

upstream power_meals {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name powermeals.mx www.powermeals.mx;
    return 301 https://powermeals.mx$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name powermeals.mx www.powermeals.mx;

    ssl_certificate     /etc/letsencrypt/live/powermeals.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/powermeals.mx/privkey.pem;

    client_max_body_size 1m;

    # Behind CloudFront, $remote_addr is an edge IP, so per-IP rate limits would throttle
    # every client sharing that edge. Restore the client IP from CloudFront's origin-facing
    # ranges (AWS managed prefix list com.amazonaws.global.cloudfront.origin-facing).
    # set_real_ip_from <cloudfront-origin-facing-cidr>;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Connection        "";
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        limit_req zone=pm_auth burst=5 nodelay;
        proxy_pass http://power_meals;
    }

    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        # Add the monitoring source (e.g. VPC CIDR) here, then deny the rest.
        deny all;
        proxy_pass http://power_meals;
    }

    location / {
        limit_req zone=pm_general burst=40 nodelay;
        proxy_pass http://power_meals;
    }
}
