# /etc/rsyslog.d/30-power-meals.conf
# Copies the JSON log lines (lib/log.ts) of the power-meals* units out of the journal into one file that the
# CloudWatch agent ships. Everything stays in journald as well. Other output (Next.js startup, raw stack traces)
# is not copied; Sentry has the uncaught errors.
template(name="PowerMealsJson" type="string" string="%msg:R,ERE,0,DFLT:[{].*--end%\n")

if ($programname startswith "power-meals") and ($msg contains "{\"ts\":") then {
  action(type="omfile" file="/var/log/power-meals/app.log" template="PowerMealsJson"
         fileCreateMode="0640" fileGroup="adm" dirCreateMode="0750" dirGroup="adm")
}
